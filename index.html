<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>repaint</title>

    <style>
      html, body, canvas {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: black;
      }

      #error {
        position: fixed;
        left: 12px;
        top: 12px;
        max-width: min(720px, calc(100vw - 24px));
        padding: 12px 14px;
        background: rgba(0, 0, 0, 0.78);
        color: #ffb4b4;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre-wrap;
        pointer-events: none;
        display: none;
      }

      canvas {
        display: block;
      }
    </style>
  </head>

  <body>
    <div id="error"></div>
    <canvas id="canvas"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
